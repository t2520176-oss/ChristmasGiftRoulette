name: Build Bake Your Way APK

on:
  push:
    branches: ["**"]
    paths:
      - "BakeYourWay/**"
      - ".github/workflows/build-bake-your-way.yml"
  pull_request:
    paths:
      - "BakeYourWay/**"
      - ".github/workflows/build-bake-your-way.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BakeYourWay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: BakeYourWay

      - name: Unit tests (recipe data + calculator)
        run: ./gradlew :core:test --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Verify the APK exists and inspect it
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la app/build/outputs/apk/debug/
          test -f "$APK"
          unzip -l "$APK" | grep -E "assets/data/(index|ingredients|addins|toppings)\.json"
          unzip -l "$APK" | grep -c "assets/data/recipes/" 
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          echo "--- permissions declared by the APK (none expected) ---"
          "$AAPT2" dump permissions "$APK"
          echo "--- badging ---"
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|uses-permission)" || true
          if "$AAPT2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission found - not allowed"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BakeYourWay-debug-apk
          path: BakeYourWay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            BakeYourWay/core/build/reports
            BakeYourWay/core/build/test-results
            BakeYourWay/app/build/reports
