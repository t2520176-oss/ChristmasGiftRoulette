name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Verify APKs exist
        run: |
          ls -la app/build/outputs/apk/debug/ finder/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/ChristmasGiftRoulette-debug.apk
          test -f finder/build/outputs/apk/debug/ChristmasGiftFinder-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChristmasGiftRoulette-debug-apk
          path: app/build/outputs/apk/debug/ChristmasGiftRoulette-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ChristmasGiftFinder-debug-apk
          path: finder/build/outputs/apk/debug/ChristmasGiftFinder-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/test-results
            finder/build/reports
            finder/build/test-results
