name: Build LIFE - YOUR CHOICE APK

on:
  push:
    branches: ["**"]
    paths:
      - "LifeYourChoice/**"
      - ".github/workflows/build-life-your-choice.yml"
  pull_request:
    paths:
      - "LifeYourChoice/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeYourChoice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine and story tests (JVM)
        run: ./gradlew :core:test --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/LifeYourChoice-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LifeYourChoice-debug-apk
          path: LifeYourChoice/app/build/outputs/apk/debug/LifeYourChoice-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            LifeYourChoice/core/build/reports
            LifeYourChoice/app/build/reports
