<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm & Tarot · 손금 타로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b1a; --bg2:#17132b; --panel:rgba(255,255,255,.04); --line:rgba(226,191,120,.25);
  --gold:#e2bf78; --gold2:#f6dfa6; --ink:#ece6f6; --muted:#a69cbf; --rose:#c98bb9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Gowun Batang","Cormorant Garamond",serif;min-height:100vh;line-height:1.65;
  background:radial-gradient(1200px 600px at 50% -10%,#2a1f4d 0%,transparent 60%),radial-gradient(800px 500px at 100% 100%,#251634 0%,transparent 60%),var(--bg);}
body.en{font-family:"Cormorant Garamond","Gowun Batang",serif;font-size:18px}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(20px + var(--safe-area-inset-top,env(safe-area-inset-top,0px))) 18px calc(80px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.brand{font-family:Cinzel,serif;letter-spacing:.18em;color:var(--gold);font-size:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:600 13px Cinzel,serif;padding:7px 14px;cursor:pointer;letter-spacing:.08em}
.lang button.on{background:var(--gold);color:#1b1430}
.hero{text-align:center;padding:34px 0 26px}
.hero h1{font-family:Cinzel,"Gowun Batang",serif;font-weight:700;font-size:clamp(28px,7vw,44px);letter-spacing:.06em;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#b48a45);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:8px}
.steps{display:flex;justify-content:center;gap:8px;margin:6px 0 22px}
.steps span{width:30px;height:3px;border-radius:3px;background:rgba(255,255,255,.12)}
.steps span.on{background:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;backdrop-filter:blur(4px)}
.panel h2{font-family:Cinzel,"Gowun Batang",serif;color:var(--gold);font-size:19px;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.panel h2 .n{font-size:12px;border:1px solid var(--gold);border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center}
label.lbl{display:block;color:var(--muted);font-size:14px;margin:4px 0 6px}
textarea,select{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:12px}
textarea{min-height:76px;resize:vertical}
.drop{margin-top:16px;border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.drop:hover{border-color:var(--gold)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ico{font-size:30px;color:var(--gold)}
.drop small{display:block;color:var(--muted);margin-top:4px}
.preview{display:none;margin-top:14px;text-align:center}
.preview img{max-width:100%;max-height:300px;border-radius:12px;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;width:100%;padding:14px 18px;border-radius:14px;border:0;cursor:pointer;
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1430;font:700 16px "Gowun Batang",Cinzel,serif;letter-spacing:.03em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--gold)}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.err{color:#ff9fa8;font-size:14px;margin-top:10px}
.hidden{display:none!important}
.loader{text-align:center;padding:30px 0;color:var(--muted)}
.orb{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#c9b4ff 18%,#5a3fa0 55%,#1d1240 100%);
  box-shadow:0 0 40px #7d5fd0;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 70px #a38cff}}
.lines{display:grid;gap:12px}
.lineItem{border-left:2px solid var(--gold);padding:4px 0 4px 14px}
.lineItem b{color:var(--gold2);font-family:Cinzel,"Gowun Batang",serif;font-size:15px;letter-spacing:.03em}
.lineItem p{color:var(--ink);font-size:15px}
.summary{margin-top:16px;padding:14px;border-radius:12px;background:rgba(226,191,120,.08);font-style:italic}
.manual{display:grid;gap:12px;margin-top:14px}
/* tarot */
.fan{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.fan .back{width:62px;height:104px;cursor:pointer;transition:transform .25s,opacity .25s}
.fan .back:hover{transform:translateY(-6px)}
.fan .back.picked{opacity:.15;pointer-events:none;transform:translateY(-10px)}
.spread{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.slot{text-align:center}
.slot .pos{font-family:Cinzel,"Gowun Batang",serif;color:var(--gold);font-size:13px;letter-spacing:.12em;margin-bottom:8px}
.flip{perspective:900px;width:100%;max-width:150px;aspect-ratio:3/5;margin:0 auto}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.show .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip .front.rev svg{transform:rotate(180deg)}
.flip svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.cname{margin-top:8px;font-size:14px;color:var(--ink);min-height:2.6em}
.cname em{display:block;font-style:normal;color:var(--rose);font-size:12px}
.kw{font-size:12px;color:var(--muted)}
/* reading */
.reading h3{font-family:Cinzel,"Gowun Batang",serif;color:var(--gold2);font-size:22px;text-align:center;margin-bottom:14px}
.reading .sec{margin-top:16px}
.reading .sec b{display:block;color:var(--gold);font-size:14px;letter-spacing:.08em;margin-bottom:4px}
.reading p{white-space:pre-wrap}
.advice{margin-top:18px;padding:16px;border:1px solid var(--gold);border-radius:14px;text-align:center;font-size:17px}
/* palm scan */
.scanBox{position:relative;display:inline-block;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.scanBox img{display:block;max-width:100%;max-height:340px;border:0;border-radius:0}
.scanBox svg.ov{position:absolute;inset:0;width:100%;height:100%}
.scanBox .grid{position:absolute;inset:0;opacity:0;transition:opacity .6s;
  background-image:linear-gradient(rgba(143,211,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(143,211,255,.18) 1px,transparent 1px);background-size:22px 22px}
.scanBox .bar{position:absolute;left:0;right:0;height:60px;top:-60px;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(143,211,255,.35) 70%,#bfe8ff 98%,transparent);box-shadow:0 8px 24px rgba(143,211,255,.5)}
.scanBox .tint{position:absolute;inset:0;background:rgba(10,8,30,.0);transition:background .6s}
.scanBox .corner{position:absolute;width:22px;height:22px;border:2px solid #8fd3ff;opacity:0;transition:opacity .4s}
.scanBox .c1{top:8px;left:8px;border-right:0;border-bottom:0}.scanBox .c2{top:8px;right:8px;border-left:0;border-bottom:0}
.scanBox .c3{bottom:8px;left:8px;border-right:0;border-top:0}.scanBox .c4{bottom:8px;right:8px;border-left:0;border-top:0}
.scanBox .hud{position:absolute;left:10px;right:10px;bottom:12px;text-align:center;font:600 12px Cinzel,"Gowun Batang",sans-serif;letter-spacing:.08em;color:#bfe8ff;text-shadow:0 0 8px #3aa0ff;opacity:0}
.scanBox .pct{position:absolute;top:12px;left:0;right:0;text-align:center;font:700 13px Cinzel,monospace;color:#bfe8ff;text-shadow:0 0 8px #3aa0ff;opacity:0}
.scanBox.scanning .grid,.scanBox.scanning .corner,.scanBox.scanning .hud,.scanBox.scanning .pct{opacity:1}
.scanBox.scanning .tint{background:rgba(10,8,30,.35)}
.scanBox.scanning .bar{opacity:1;animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%{top:-60px}50%{top:calc(100% - 10px)}100%{top:-60px}}
.scanBox.scanning .corner{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.ov path.ln{fill:none;stroke-width:1;stroke-linecap:round;filter:url(#glow);stroke-dasharray:100;stroke-dashoffset:100}
.ov path.ln.draw{animation:draw 1.4s ease-out forwards}
.ov path.ln.done{stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.ov .dot{opacity:0}.ov .dot.on{opacity:1;animation:dotp 1s ease-in-out infinite}
@keyframes dotp{50%{opacity:.4}}
.palmFig{text-align:center;margin-bottom:16px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* shuffle stage */
.stage{position:relative;height:300px;margin:10px auto 0;max-width:520px;touch-action:none;user-select:none;-webkit-user-select:none}
.stage .tc{position:absolute;left:50%;top:50%;width:66px;height:110px;margin:-55px 0 0 -33px;transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .4s,filter .3s;will-change:transform;cursor:grab}
.stage .tc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55))}
.stage.fanned .tc{cursor:pointer}
.stage.fanned .tc:hover{filter:brightness(1.25)}
.stage .tc.gone{opacity:0;pointer-events:none}
.stage .hint{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
.ctrls{display:flex;gap:10px}.ctrls .btn{margin-top:12px}
@media (max-width:420px){.stage{height:270px}.stage .tc{width:54px;height:90px;margin:-45px 0 0 -27px}}
.gear{background:none;border:1px solid var(--line);color:var(--gold);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,4,15,.75);display:grid;place-items:center;padding:18px}
.mbox{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px}
.mbox input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:12px}
.banner{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--gold2);cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
@media (max-width:420px){.fan .back{width:52px;height:88px}.spread{gap:8px}.panel{padding:18px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <header>
    <div class="brand">PALM · TAROT</div>
    <div style="display:flex;gap:8px;align-items:center"><div class="lang"><button data-l="ko">한국어</button><button data-l="en">EN</button></div><button class="gear" id="gearBtn" aria-label="settings">⚙</button></div>
  </header>

  <div class="hero">
    <h1 data-t="title"></h1>
    <p data-t="subtitle"></p>
  </div>
  <div class="steps"><span></span><span></span><span></span><span></span></div>

  <!-- STEP 1 -->
  <section class="panel" id="s1">
    <h2><span class="n">1</span><span data-t="s1h"></span></h2>
    <label class="lbl" data-t="qLabel"></label>
    <textarea id="q" data-ph="qPh"></textarea>

    <div id="aiUpload">
      <div class="drop" id="drop">
        <input type="file" id="file" accept="image/*">
        <div class="ico">✋</div>
        <div data-t="upload"></div>
        <small data-t="uploadTip"></small>
      </div>
      <div class="preview" id="preview">
        <div class="scanBox" id="scanBox">
          <img id="previewImg" alt="">
          <div class="tint"></div><div class="grid"></div><div class="bar"></div>
          <svg class="ov" id="ov" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
          <div class="pct" id="pct"></div><div class="hud" id="hud"></div>
        </div>
      </div>
      <button class="btn" id="analyzeBtn" disabled data-t="analyze"></button>
    </div>

    <div id="manualBox" class="hidden">
      <p class="note" data-t="manualNote"></p><div class="banner" id="keyBanner" data-t="needKey"></div>
      <div class="manual" id="manual"></div>
      <button class="btn" id="manualBtn" data-t="manualGo"></button>
    </div>
    <div class="err hidden" id="err1"></div>
  </section>

  <!-- STEP 2 -->
  <section class="panel hidden" id="s2">
    <h2><span class="n">2</span><span data-t="s2h"></span></h2>
    <div class="loader hidden" id="palmLoad"><div class="orb"></div><span data-t="palmLoading"></span></div>
    <div id="palmOut"></div>
    <button class="btn hidden" id="toTarot" data-t="toTarot"></button>
  </section>

  <!-- STEP 3 -->
  <section class="panel hidden" id="s3">
    <h2><span class="n">3</span><span data-t="s3h"></span></h2>
    <p class="note" id="pickNote"></p>
    <div id="deckArea">
      <div class="stage" id="stage"><div class="hint" id="stageHint"></div></div>
      <div class="ctrls"><button class="btn ghost" id="shuffleBtn" data-t="shuffle"></button><button class="btn" id="spreadBtn" disabled data-t="spreadBtn"></button></div>
    </div>
    <div class="spread" id="spread"></div>
    <button class="btn hidden" id="readBtn" data-t="readBtn"></button>
  </section>

  <!-- STEP 4 -->
  <section class="panel hidden" id="s4">
    <h2><span class="n">4</span><span data-t="s4h"></span></h2>
    <div class="loader hidden" id="readLoad"><div class="orb"></div><span data-t="readLoading"></span></div>
    <div class="reading" id="readOut"></div>
    <div class="err hidden" id="err4"></div>
    <button class="btn ghost hidden" id="restart" data-t="restart"></button>
  </section>

  <footer data-t="footer"></footer>
</div>
<div class="modal hidden" id="modal"><div class="mbox">
  <h2 style="font-family:Cinzel,'Gowun Batang',serif;color:var(--gold);font-size:18px;margin-bottom:10px" data-t="setTitle"></h2>
  <p class="note" style="margin-top:0" data-t="setDesc"></p>
  <label class="lbl" style="margin-top:12px" data-t="setKey"></label>
  <input id="keyIn" type="password" autocomplete="off" placeholder="sk-ant-...">
  <label class="lbl" style="margin-top:12px" data-t="setModel"></label>
  <input id="modelIn" type="text" autocomplete="off">
  <p class="note">console.anthropic.com → API Keys</p>
  <div class="err hidden" id="keyErr"></div>
  <div class="ctrls"><button class="btn ghost" id="keyDel" data-t="setDel"></button><button class="btn" id="keySave" data-t="setSave"></button></div>
  <button class="btn ghost" id="modalClose" style="margin-top:10px" data-t="setClose"></button>
</div></div>

<script>
/* ---------- i18n ---------- */
const T={
ko:{title:"손금 × 타로",subtitle:"손바닥에 새겨진 길과 카드가 전하는 메시지를 함께 읽어요",
 s1h:"질문과 손바닥",qLabel:"마음속 질문 (선택)",qPh:"예) 올해 이직해도 괜찮을까요?",
 upload:"손바닥 사진 올리기",uploadTip:"밝은 곳에서 주로 쓰는 손을 펴고 찍어주세요",analyze:"손금 분석하기",
 manualNote:"AI 사진 분석을 쓸 수 없는 환경이에요. 내 손금 모양을 직접 골라주세요.",manualGo:"손금 확인하기",

function frame(inner){
 return `<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2152"/><stop offset="1" stop-color="#120d26"/></linearGradient></defs>
 <rect x="1" y="1" width="118" height="198" rx="9" fill="url(#cg)" stroke="#e2bf78" stroke-width="1.5"/>
 <rect x="7" y="7" width="106" height="186" rx="6" fill="none" stroke="#e2bf78" stroke-opacity=".45"/>${inner}</svg>`;}
function cardFace(c){
 let mid;
 if(c.major){
  mid=`<circle cx="60" cy="98" r="34" fill="none" stroke="#e2bf78" stroke-opacity=".35"/>
  <circle cx="60" cy="98" r="27" fill="rgba(226,191,120,.08)"/>
  <text x="60" y="111" text-anchor="middle" font-size="38" fill="#f6dfa6" font-family="serif">${c.glyph}︎</text>`;
 }else{
  const i=c.rankIdx, icon=SUIT_ICON[c.suit];
  if(i>=10){mid=`<g transform="translate(60 100) scale(1.35)">${icon}</g><text x="60" y="152" text-anchor="middle" font-size="12" fill="#c98bb9" font-family="Cinzel,serif" letter-spacing="2">${["PAGE","KNIGHT","QUEEN","KING"][i-10]}</text>`;}
  else{const n=i+1, pts=[];const cols=n>3?2:1, rows=Math.ceil(n/cols);
   for(let k=0;k<n;k++){const col=cols===1?0:(k%2), row=cols===1?k:Math.floor(k/2);
    const x=cols===1?60:(col?78:42), y=100+(row-(rows-1)/2)*(rows>3?24:30);pts.push([x,y]);}
   const sc=n===1?1.5:n<=3?.75:.55;
   mid=pts.map(p=>`<g transform="translate(${p[0]} ${p[1]}) scale(${sc})">${icon}</g>`).join("");}
 }
 return frame(`<text x="60" y="30" text-anchor="middle" font-size="14" fill="#e2bf78" font-family="Cinzel,serif" letter-spacing="2">${c.num}</text>${mid}
  <path d="M30 176 h60" stroke="#e2bf78" stroke-opacity=".5"/><text x="60" y="188" text-anchor="middle" font-size="8" fill="#e2bf78" fill-opacity=".7" font-family="Cinzel,serif" letter-spacing="1.5">${c.major?"ARCANA":c.suit.toUpperCase()}</text>`);}

async function askJSON(prompt,opts={}){
 const ai=S.ai;
 if(typeof ai.json==="function"){try{return await ai.json(prompt,opts);}catch(e){if(e&&(e.code==="rate_limited"||e.code==="not_granted"))throw e;}}
 const r=await ai(prompt,opts);const m=(r.text||"").match(/\{[\s\S]*\}/);if(!m)throw new Error("no json");return JSON.parse(m[0]);
}
function errMsg(e){if(e&&e.code==="auth")return T[lang].keyBad;return e&&e.code==="rate_limited"?T[lang].errRate:T[lang].errAI;}

async function shrink(file){
 let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"});}catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});}
 const max=1280,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
 const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
 c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}

function toPath(pts){
 if(!Array.isArray(pts)||pts.length<2)return "";
 const P=pts.map(p=>[Math.max(0,Math.min(100,+p[0])),Math.max(0,Math.min(100,+p[1]))]);
 let d=`M${P[0][0]} ${P[0][1]}`;
 for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2,my=(P[i][1]+P[i+1][1])/2;d+=` Q${P[i][0]} ${P[i][1]} ${mx} ${my}`;}
 const l=P[P.length-1];return d+` L${l[0]} ${l[1]}`;
}
function ovMarkup(trace,cls){
 const keys=["heart","head","life","fate"];
 return `<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`+
 keys.map(k=>{const pts=(trace&&trace[k])||null;const d=toPath(pts);if(!d)return "";const e=pts[pts.length-1];
  return `<path class="ln ${cls}" data-k="${k}" pathLength="100" d="${d}" stroke="${COL[k]}"/><circle class="dot ${cls==="done"?"on":""}" data-k="${k}" cx="${e[0]}" cy="${e[1]}" r="1.1" fill="${COL[k]}"/>`;}).join("");
}

function startScan(){

  p=Math.min(97,p+Math.random()*4+1.5);pct.textContent=Math.floor(p)+"%";
  const s=Math.min(5,Math.floor(p/17));
  if(s!==step){step=s;hud.textContent=T[lang].scan[s];
   const k=order[s-1];if(k){ov.querySelector(`path[data-k="${k}"]`)?.classList.add("draw");ov.querySelector(`circle[data-k="${k}"]`)?.classList.add("on");}}
 },160);
}
async function endScan(trace,ok){

 $("pct").textContent="100%";$("hud").textContent=T[lang].scanDone;

 await sleep(1500);box.classList.remove("scanning");

  $("preview").style.display="none";S.palm=res;show("s2");setStep(2);renderPalm();$("toTarot").classList.remove("hidden");
 }catch(e){
  await endScan(null,false);$("err1").textContent=errMsg(e);$("err1").classList.remove("hidden");$("analyzeBtn").disabled=false;
 }
};
$("manualBtn").onclick=()=>{
 const lines={};$("manual").querySelectorAll("select").forEach(s=>{const o=MANUAL[s.name][+s.value];lines[s.name]={ko:`${o.ko} — ${o.rk}`,en:`${o.en} — ${o.re}`,_o:o};});
 S.palm={hand:null,lines,summary:{ko:"당신의 손금은 고유한 성향과 가능성을 보여줘요. 이제 카드가 지금 이 순간의 흐름을 더해줄 거예요.",en:"Your lines reveal your own tendencies and potential. Now the cards will add the flow of this moment."}};
 show("s2");setStep(2);renderPalm();$("toTarot").classList.remove("hidden");
};

/* ---------- step 3: shuffle & draw ---------- */
const N=22;let tcs=[],busy=false,washing=false,lastWash=0;
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newPool(){S.pool=shuffleArr([...DECK]).slice(0,N);}
function setT(el,x,y,r,s=1){el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;}
function stack(stagger=0){tcs.forEach((el,i)=>{const go=()=>{el.style.zIndex=i;setT(el,(i-N/2)*.25,-i*.45,(Math.random()-.5)*3);};stagger?setTimeout(go,i*stagger):go();});}
function buildStage(){
 const st=$("stage");st.classList.remove("fanned");st.querySelectorAll(".tc").forEach(e=>e.remove());
 tcs=[];for(let i=0;i<N;i++){const el=document.createElement("div");el.className="tc";el.dataset.i=i;el.innerHTML=BACK;el.onclick=()=>pickCard(el);st.appendChild(el);tcs.push(el);}
 setT(tcs[0],0,0,0);requestAnimationFrame(()=>stack(18));
}
async function riffle(){
 if(busy||$("stage").classList.contains("fanned"))return;busy=true;$("shuffleBtn").disabled=true;
 const w=$("stage").clientWidth,dx=Math.min(110,w*.24);
 for(let r=0;r<3;r++){
  const half=N/2;
  tcs.forEach((el,i)=>{const L=i<half;setT(el,(L?-dx:dx)+(Math.random()-.5)*4,-(i%half)*.6-6,L?-12:12);});
  await sleep(380);
  // lift edges like a riffle
  tcs.forEach((el,i)=>{const L=i<half;setT(el,(L?-dx*.55:dx*.55),-(i%half)*1.2-24,L?-24:24);});
  await sleep(260);
  const order=[];for(let k=0;k<half;k++){if(Math.random()<.5){order.push(tcs[k],tcs[k+half]);}else{order.push(tcs[k+half],tcs[k]);}}
  tcs=order;
  tcs.forEach((el,i)=>setTimeout(()=>{el.style.zIndex=i;setT(el,(i-N/2)*.25,-i*.45,(Math.random()-.5)*4);},i*22));
  await sleep(N*22+380);
  // bridge squeeze
  tcs.forEach((el,i)=>setT(el,(i-N/2)*.25,-i*.45-10,0,1.04));await sleep(220);stack();await sleep(320);
 }
 newPool();busy=false;$("shuffleBtn").disabled=false;$("spreadBtn").disabled=false;
}
function stagePoint(e){const r=$("stage").getBoundingClientRect();return [e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2];}
$("stage").addEventListener("pointerdown",e=>{if(busy||$("stage").classList.contains("fanned"))return;washing=true;$("stage").setPointerCapture?.(e.pointerId);wash(e,true);});
$("stage").addEventListener("pointermove",e=>{if(washing)wash(e);});
const endWash=()=>{if(!washing)return;washing=false;tcs=shuffleArr(tcs);stack(14);newPool();$("spreadBtn").disabled=false;};
$("stage").addEventListener("pointerup",endWash);$("stage").addEventListener("pointercancel",endWash);
function wash(e,force){
 const now=performance.now();if(!force&&now-lastWash<90)return;lastWash=now;
 const [px,py]=stagePoint(e),w=$("stage").clientWidth/2-40,h=$("stage").clientHeight/2-60;
 const n=force?N:7;
 for(let k=0;k<n;k++){const el=tcs[Math.floor(Math.random()*N)];
  const x=Math.max(-w,Math.min(w,px*.6+(Math.random()-.5)*170)),y=Math.max(-h,Math.min(h,py*.6+(Math.random()-.5)*110));
  el.style.zIndex=Math.floor(Math.random()*N);setT(el,x,y,(Math.random()-.5)*160);}
}
function fanOut(){
 const st=$("stage");if(busy)return;busy=true;st.classList.add("fanned");
 const w=st.clientWidth,cw=tcs[0].offsetWidth,A=62*Math.PI/180,R=(w/2-cw/2-4)/Math.sin(A);
 tcs.forEach((el,i)=>setTimeout(()=>{const a=-A+2*A*i/(N-1);el.style.zIndex=i;
  setT(el,R*Math.sin(a),-46+R*(1-Math.cos(a)),a*180/Math.PI);},i*28));
 setTimeout(()=>{busy=false;},N*28+400);
 $("shuffleBtn").disabled=true;$("spreadBtn").disabled=true;$("stageHint").textContent="";updatePickNote();
}
$("shuffleBtn").onclick=riffle;$("spreadBtn").onclick=fanOut;
$("toTarot").onclick=()=>{
 $("toTarot").classList.add("hidden");S.picks=[];S.reading=null;newPool();
 $("deckArea").classList.remove("hidden");$("readBtn").classList.add("hidden");
 $("shuffleBtn").disabled=false;$("spreadBtn").disabled=true;
 show("s3");setStep(3);buildStage();renderSpread();updatePickNote();
};
function updatePickNote(){
 const fanned=$("stage").classList.contains("fanned");
 $("pickNote").textContent=!fanned&&S.picks.length===0?T[lang].shuffleNote:(S.picks.length<3?T[lang].pick(S.picks.length):T[lang].picked);
 $("stageHint").textContent=fanned?"":T[lang].hintWash;
}
function pickCard(el){
 if(!$("stage").classList.contains("fanned")||busy||S.picks.length>=3||el.classList.contains("gone"))return;
 const cur=el.style.transform;el.style.zIndex=99;el.style.transform=cur.replace(/scale\([^)]*\)/,"")+" translateY(-46px) scale(1.18)";
 setTimeout(()=>el.classList.add("gone"),420);
 const idx=S.picks.length;S.picks.push({card:S.pool[+el.dataset.i],rev:Math.random()<.3,shown:false});
 renderSpread();updatePickNote();
 setTimeout(()=>{S.picks[idx].shown=true;$("f"+idx)?.classList.add("show");setTimeout(renderSpread,950);
  if(S.picks.length===3)setTimeout(()=>{$("deckArea").classList.add("hidden");$("readBtn").classList.remove("hidden");$("readBtn").scrollIntoView({behavior:"smooth",block:"center"});},1300);
 },450);
}

/* ---------- step 4 ---------- */
$("readBtn").onclick=async()=>{
 $("readBtn").classList.add("hidden");show("s4");setStep(4);$("err4").classList.add("hidden");
 $("readOut").innerHTML="";$("restart").classList.add("hidden");
 const q=$("q").value.trim();
 const cards=S.picks.map((p,i)=>`${["Past","Present","Future"][i]}: ${p.card.name.en} (${p.card.name.ko}) — ${p.rev?"REVERSED":"upright"}; keywords: ${p.card.kw.en}`).join("\n");
 const palm=["heart","head","life","fate"].map(k=>`${k}: ${S.palm.lines[k]?.en||"-"}`).join("\n")+`\nsummary: ${S.palm.summary?.en||""}`;
 if(S.ai){
  $("readLoad").classList.remove("hidden");
  const prompt=`You are a gentle, wise reader combining palmistry and tarot for an entertainment app.
User's question: ${q||"(none — give a general reading for the coming period)"}
Palm reading (the person's lasting nature):
${palm}
Tarot spread (Past / Present / Future):
${cards}
Weave them together: palm = who they are and their strengths; cards = the current flow around the question. Be specific, encouraging and honest; reversed cards mean blocked or inner energy. No medical, legal, financial certainty or fatalistic predictions.
Write in BOTH Korean (natural 해요체) and English (not literal translation — natural in each).
Return ONLY JSON:
{"ko":{"title":"short evocative title","overview":"3-4 sentences","cards":["past 2 sentences","present 2 sentences","future 2 sentences"],"palm_link":"2-3 sentences linking palm traits to the cards","advice":"one memorable sentence"},
"en":{same keys}}`;
  try{S.reading=await askJSON(prompt,{modelTier:"default"});$("readLoad").classList.add("hidden");renderReading();}
  catch(e){$("readLoad").classList.add("hidden");$("err4").textContent=errMsg(e);$("err4").classList.remove("hidden");$("readBtn").classList.remove("hidden");return;}
 }else{
  S.reading=templateReading(q);renderReading();
 }
 $("restart").classList.remove("hidden");
};
function templateReading(q){
 const p=S.picks, ln=S.palm.lines;
 const ko={title:`${p[1].card.name.ko}이(가) 비추는 지금`,
  overview:`${q?`"${q}"에 대해 `:""}과거의 ${p[0].card.name.ko}에서 시작된 흐름이 현재 ${p[1].card.name.ko}의 에너지로 이어지고, ${p[2].card.name.ko}의 방향으로 나아가고 있어요.`,
  cards:p.map(x=>`${x.rev?"역방향으로 나와 이 에너지가 아직 막혀 있거나 내면에서 다듬어지는 중이에요":"정방향으로 나와 이 에너지가 자연스럽게 흐르고 있어요"}. 핵심은 ${x.card.kw.ko}.`),
  palm_link:`${ln.head?._o?.rk||""} ${ln.heart?._o?.rk||""} 이런 성향이 ${p[2].card.name.ko}의 흐름을 만나면 큰 힘이 돼요.`,
  advice:`${p[2].card.kw.ko.split("·")[0].trim()}을(를) 믿고 한 걸음 내디뎌 보세요.`};
 const en={title:`What ${p[1].card.name.en} illuminates now`,
  overview:`${q?`About "${q}": `:""}A current that began with ${p[0].card.name.en} flows into the energy of ${p[1].card.name.en} today, moving toward ${p[2].card.name.en}.`,
  cards:p.map(x=>`${x.rev?"Reversed — this energy is blocked or still forming within you":"Upright — this energy flows freely"}. Its core: ${x.card.kw.en}.`),
  palm_link:`${ln.head?._o?.re||""} ${ln.heart?._o?.re||""} Those traits are real strengths as you meet the path of ${p[2].card.name.en}.`,
  advice:`Trust ${p[2].card.kw.en.split(",")[0].split(";")[0].trim()} and take one step forward.`};
 return {ko,en};
}
$("restart").onclick=()=>{
 $("ov").innerHTML="";Object.assign(S,{photo:null,photoURL:null,palm:null,pool:[],picks:[],reading:null});
 ["s2","s3","s4"].forEach(id=>$(id).classList.add("hidden"));
 $("preview").style.display="none";$("file").value="";$("analyzeBtn").disabled=true;$("q").value="";
 renderPalm();renderSpread();renderReading();setStep(1);window.scrollTo({top:0,behavior:"smooth"});
};

/* ---------- stars ---------- */
(()=>{const c=$("stars"),x=c.getContext("2d");let W,H,st=[];
 function rs(){W=c.width=innerWidth;H=c.height=innerHeight;st=Array.from({length:Math.min(140,W/6)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6}));}
 rs();addEventListener("resize",rs);
 (function f(t){x.clearRect(0,0,W,H);st.forEach(s=>{x.globalAlpha=.35+.35*Math.sin(t/900+s.p);x.fillStyle="#f6dfa6";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();});requestAnimationFrame(f);})(0);})();

/* ---------- direct Claude API (app mode) ---------- */
const DEFAULT_MODEL="claude-sonnet-5-5";
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b);});}
function makeDirect(key,model){
 const f=async(prompt,opts={})=>{
  const content=[];
  for(const im of (opts.images||[]))content.push({type:"image",source:{type:"base64",media_type:im.type||"image/jpeg",data:await blobToB64(im)}});
  content.push({type:"text",text:prompt});
  let r;
  try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
   body:JSON.stringify({model:model||DEFAULT_MODEL,max_tokens:3000,messages:[{role:"user",content}]})});}
  catch(e){throw {code:"network",message:String(e)};}
  if(r.status===401||r.status===403)throw {code:"auth"};
  if(r.status===429||r.status===529)throw {code:"rate_limited"};
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw {code:"api",message:j&&j.error&&j.error.message};
  return {text:(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("")};
 };
 f.limits=async()=>({images:true});
 return f;
}
function setMode(){
 const on=!!(S.ai&&S.aiImages);
 $("aiUpload").classList.toggle("hidden",!on);$("manualBox").classList.toggle("hidden",on);
 $("keyBanner").classList.toggle("hidden",!!window.__inClaude);
}
function openModal(){$("keyIn").value=store.get("pt_key");$("modelIn").value=store.get("pt_model")||DEFAULT_MODEL;$("keyErr").classList.add("hidden");$("modal").classList.remove("hidden");}
$("gearBtn").onclick=openModal;$("keyBanner").onclick=openModal;$("modalClose").onclick=()=>$("modal").classList.add("hidden");
$("keySave").onclick=()=>{const k=$("keyIn").value.trim();if(!k){$("keyErr").textContent=T[lang].keyEmpty;$("keyErr").classList.remove("hidden");return;}
 store.set("pt_key",k);store.set("pt_model",$("modelIn").value.trim()||DEFAULT_MODEL);
 S.ai=makeDirect(k,store.get("pt_model"));S.aiImages=true;setMode();$("modal").classList.add("hidden");};
$("keyDel").onclick=()=>{store.set("pt_key","");$("keyIn").value="";S.ai=null;S.aiImages=false;setMode();};

/* ---------- boot ---------- */
setStep(1);applyLang();
(async()=>{
 let ai=null,img=false;
 if(window.claude&&typeof window.claude.use==="function"){
  window.__inClaude=true;
  try{ai=await window.claude.use("sample");}catch(e){}
  if(ai){try{const lim=typeof ai.limits==="function"?await ai.limits():null;img=!!(lim&&lim.images);}catch(e){}}
 }
 if(!ai){const k=store.get("pt_key");if(k){ai=makeDirect(k,store.get("pt_model"));img=true;}}
 if(!window.__inClaude)$("gearBtn").classList.remove("hidden");else $("gearBtn").classList.add("hidden");
 S.ai=ai;S.aiImages=img;setMode();
})();
</script>
